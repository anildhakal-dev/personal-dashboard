<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard · Log in</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="icon" href="/static/icon-192.png">
    <meta name="theme-color" content="#0b0d17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Dashboard">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: grid; place-items: center; padding: 16px;
            font-family: "Plus Jakarta Sans", -apple-system, sans-serif;
            background: #0b0d17; color: #eef0ff; overflow: hidden;
        }
        /* Same floating glows as the dashboard */
        body::before, body::after {
            content: ""; position: fixed; width: 480px; height: 480px; border-radius: 50%;
            filter: blur(120px); z-index: -1; animation: float 12s ease-in-out infinite alternate;
        }
        body::before { background: #8b5cf6; opacity: 0.4; top: -140px; right: -120px; }
        body::after { background: #22d3ee; opacity: 0.22; bottom: -180px; left: -100px; animation-delay: -6s; }
        @keyframes float { to { transform: translate(-50px, 40px) scale(1.15); } }

        .box {
            width: 100%; max-width: 380px; text-align: center;
            padding: 40px 30px; border-radius: 26px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
        }
        .mark {
            width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px;
            display: grid; place-items: center; font-size: 30px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            box-shadow: 0 10px 34px rgba(139,92,246,0.55);
        }
        h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
        p { margin: 0 0 26px; color: #8b90b0; }
        input {
            width: 100%; font-family: inherit; font-size: 16px;
            padding: 14px 16px; margin-bottom: 12px;
            background: rgba(255,255,255,0.05); color: #eef0ff;
            border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; outline: none;
        }
        input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 4px rgba(139,92,246,0.25); }
        button {
            width: 100%; font-family: inherit; font-size: 16px; font-weight: 700;
            padding: 14px; border: none; border-radius: 14px; cursor: pointer; color: white;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            box-shadow: 0 10px 28px rgba(139,92,246,0.4);
        }
        .error { color: #fca5a5; font-size: 14px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <form class="box" method="POST" action="/login">
        <div class="mark">⚡</div>
        <h1>Welcome back</h1>
        <p>Log in to your dashboard</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <input type="password" name="password" placeholder="Password" autofocus required>
        <button type="submit">Log in</button>
    </form>
</body>
</html>
