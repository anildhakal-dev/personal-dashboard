{# One or more chat messages. Used on the notebook page and when a new answer arrives #}
{% for m in chat %}
<div class="msg {{ m.role }}" {% if m.role == 'assistant' %}data-cites='{{ m.cites | tojson | forceescape }}'{% endif %}>
    <div class="bubble">{{ m.content | md }}</div>
    {% if m.role == 'assistant' and m.id %}
    <div class="msg-actions">
        <button type="button" class="ghost" onclick="pinMessage({{ m.id }}, this)">📌 Save to note</button>
        <button type="button" class="ghost" onclick="copyMessage(this)">⧉ Copy</button>
    </div>
    {% endif %}
</div>
{% endfor %}
