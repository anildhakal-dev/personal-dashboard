{% extends "base.html" %}

{% block extra_style %}
<style>
    main { max-width: 760px; }
    .back { color: var(--muted); text-decoration: none; font-size: 14px; }
    .head { margin: 12px 0 20px; }
    .head h1 { font-size: 28px; }
    .head p { margin: 6px 0 0; }
    .bar { height: 8px; border-radius: 8px; background: rgba(140,105,40,0.054); overflow: hidden; margin-bottom: 8px; }
    .bar div { height: 100%; background: linear-gradient(90deg, var(--purple), var(--pink)); transition: width 0.3s; }
    .counts { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
    .q { font-size: 19px; font-weight: 700; line-height: 1.45; margin-bottom: 16px; }
    .options { display: grid; gap: 8px; }
    .opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: rgba(140,105,40,0.036); border: 1px solid var(--border); box-shadow: none; color: var(--text); font-weight: 500; padding: 13px 16px; line-height: 1.45; }
    .opt b { color: var(--muted); }
    .opt:hover { background: rgba(212,160,23,0.14); transform: none; box-shadow: none; }
    .opt.right { background: rgba(52,211,153,0.18); border-color: var(--green); }
    .opt.wrong { background: rgba(248,113,113,0.18); border-color: var(--red); }
    .explain { display: none; margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: rgba(212,160,23,0.1); font-size: 14.5px; line-height: 1.6; animation: fadeup 0.3s; }
    .explain.show { display: block; }
    .explain .src { font-size: 12px; color: var(--muted); margin-top: 8px; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
    .alt { background: rgba(140,105,40,0.063); box-shadow: none; color: var(--text); }
    .result { text-align: center; padding: 34px 24px; }
    .score { font-size: 64px; font-weight: 800; line-height: 1; }
    .review { text-align: left; margin-top: 22px; }
    .review .row { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.5; }
    .review .row .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .del { background: transparent; box-shadow: none; color: var(--muted); font-size: 12px; padding: 4px 8px; }
    .del:hover { color: var(--red); transform: none; box-shadow: none; }
</style>
{% endblock %}

{% block content %}
<a class="back" href="/study/module?m={{ quiz.module | urlencode }}">← {{ quiz.module }}</a>
<div class="head">
    <h1>🎯 {{ data.title }}</h1>
    <p class="muted">{{ data.questions|length }} questions{% if quiz.best is not none %} · best {{ quiz.best }}%{% endif %}</p>
</div>
<div id="stage"></div>
<form action="/study/quiz/{{ quiz.id }}/delete" method="post" onsubmit="return confirm('Delete this quiz?')" style="text-align:right;margin-top:14px">
    <button class="del">Delete quiz</button>
</form>

<script>
const QS = {{ data.questions | tojson }};
const ID = {{ quiz.id }};
const stage = document.getElementById("stage");
let i = 0, right = 0, answers = [];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]))
                          .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

function show() {
    if (i >= QS.length) return finish();
    const q = QS[i];
    stage.innerHTML = `
        <div class="bar"><div style="width:${100 * i / QS.length}%"></div></div>
        <div class="counts"><span>Question ${i + 1} of ${QS.length}</span><span>${right} right so far</span></div>
        <div class="card"><div class="q">${esc(q.question)}</div>
            <div class="options">${q.options.map((o, k) => `<button class="opt" onclick="pick(${k}, this)"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>
            <div class="explain" id="ex">${esc(q.explanation)}<div class="src">📎 ${esc(q.source)}</div></div>
            <div class="actions" id="next" style="display:none"><button onclick="i++; show()">${i + 1 < QS.length ? "Next →" : "See score"}</button></div>
        </div>`;
}

function pick(k, btn) {
    const q = QS[i];
    document.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === q.answer) b.classList.add("right"); });
    if (k === q.answer) right++; else btn.classList.add("wrong");
    answers[i] = k;
    document.getElementById("ex").classList.add("show");
    document.getElementById("next").style.display = "flex";
}

function finish() {
    const score = Math.round(100 * right / QS.length);
    fetch(`/study/quiz/${ID}/finish`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({score})});
    const missed = QS.map((q, k) => ({q, k})).filter(x => answers[x.k] !== x.q.answer);
    stage.innerHTML = `<div class="card result">
        <div class="score gradient-text">${score}%</div>
        <p style="font-weight:700;font-size:17px">${right} of ${QS.length} right</p>
        <div class="actions"><button onclick="i=0;right=0;answers=[];show()">Try again</button>
            <a href="/study/module?m={{ quiz.module | urlencode }}"><button class="alt">Back to notebook</button></a></div>
        ${missed.length ? `<div class="review"><h2>Review what you missed</h2>${missed.map(x => `<div class="row"><b>${esc(x.q.question)}</b>
            <div class="sub">✓ ${esc(x.q.options[x.q.answer])}</div><div class="sub">${esc(x.q.explanation)}</div></div>`).join("")}</div>` : ""}
    </div>`;
}
show();
</script>
{% endblock %}
